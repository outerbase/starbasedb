name = "starbasedb"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
STARBASE_ADMIN_TOKEN = "YOUR_ADMIN_TOKEN_HERE"

[[r2_buckets]]
binding = "STARBASE_EXPORT_BUCKET"
bucket_name = "starbase-exports"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"
