name = "starbasedb_auth"
main = "./src/index.ts"
compatibility_date = "2024-09-25"

[durable_objects]
bindings = [{ name = "DATABASE_DURABLE_OBJECT", class_name = "DatabaseDurableObject", script_name = "starbasedb" }]

[vars]
REQUIRE_EMAIL_CONFIRM = 1
PASSWORD_REQUIRE_LENGTH = 13
PASSWORD_REQUIRE_UPPERCASE = true
PASSWORD_REQUIRE_LOWERCASE = true
PASSWORD_REQUIRE_NUMBER = false
PASSWORD_REQUIRE_SPECIAL = true
# External database source details
OUTERBASE_API_KEY = ""
EXTERNAL_DB_TYPE = "postgresql"
EXTERNAL_DB_HOST = ""
EXTERNAL_DB_PORT = 0
EXTERNAL_DB_USER = ""
EXTERNAL_DB_PASS = ""
EXTERNAL_DB_DATABASE = ""
EXTERNAL_DB_DEFAULT_SCHEMA = "public"
